# Application Name
spring.application.name=hierarchy-platform

# Server Port
server.port=8080

# ==========================================
# DATABASE CONFIGURATION (Supports environment variables with local H2 fallback)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hierarchy_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# JPA/Hibernate properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# ==========================================
# SECURITY & JWT CONFIGURATION
# ==========================================
# Secret key for signing JWTs (Base64 encoded, 256-bit min strength)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity: 1 day in milliseconds (86400000)
jwt.expiration=86400000

# Enable request input validation/JSON formatting
spring.jackson.serialization.indent_output=true

# ==========================================
# CORS PRODUCTION CONFIGURATION
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
